###############################################################################
# MediaMTX Configuration for RTSP Camera Simulator
# Converts downloaded industrial AI videos to live RTSP streams.
# All streams are permanent publishers with FFmpeg -stream_loop -1 and runOnInitRestart: yes
# allowing edge gateways (e.g. VisionSphere) to reconnect seamlessly at any time.
###############################################################################

# General logging
logLevel: debug
logDestinations: [stdout]
logFile: ""

###############################################################################
# Protocols & Ports (0.0.0.0 binds to all network interfaces for LAN access)
###############################################################################

# RTSP Server (Port 8554)
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"

# WebRTC Server (Port 8889) - allows opening streams in any web browser without VLC
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]

# HLS Server (Port 8888) - HTTP Live Streaming
hls: yes
hlsAddress: :8888

# RTMP Server (Port 1935)
rtmp: yes
rtmpAddress: :1935

# REST API (Port 9997) - used by stream_manager.py to query stream status
api: yes
apiAddress: :9997

# Playback Server (Port 9996)
playback: yes
playbackAddress: :9996
playbackAllowOrigins:
  - http://127.0.0.1:3000
  - http://localhost:3000

###############################################################################
# Stream Paths Configuration
# Every stream is a permanent publisher running with:
#   -re -stream_loop -1
# and runOnInitRestart: yes
# Ensures the publisher never stops, and edge gateways can reconnect freely.
###############################################################################
paths:

  #############################################################################
