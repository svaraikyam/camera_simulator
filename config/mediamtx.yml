  #############################################################################
  # 4. VisionSphere Integration: Annotated Output Streams
  #############################################################################
  # VisionSphere annotated output: <tenant-hex>/<run-hex>
  '~^[a-f0-9]{32}/[a-f0-9]{32}$':
    source: publisher
    record: yes
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 1m
    recordDeleteAfter: 7d

  #############################################################################
  # 5. Dynamic On-Demand Converter for ANY other video in ./videos/<name>.mp4
  # When any client requests rtsp://<SERVER_IP>:8554/<name>, this automatically
  # triggers the RTX GPU to loop ./videos/<name>.mp4 on-demand with zero CPU load!
  #############################################################################
  all_others:
    runOnDemand: >-
      ffmpeg -nostats -loglevel warning
      -re -stream_loop -1
      -i ./videos/$MTX_PATH.mp4
      -map 0:v:0
      -vf "scale=w=1920:h=1080:force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2"
      -c:v h264_nvenc -preset p1 -tune ull
      -profile:v baseline -pix_fmt yuv420p -bf 0
      -r 25 -g 50
      -an -rtsp_transport tcp
      -f rtsp rtsp://127.0.0.1:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 30s
